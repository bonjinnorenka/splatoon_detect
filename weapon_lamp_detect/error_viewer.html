<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>武器誤判定Viewer</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#141820;color:#e9eef4}body{margin:16px}button,input,select,textarea{font:inherit;background:#202937;color:inherit;border:1px solid #64748b;padding:6px;margin:3px}#rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.card{border:1px solid #64748b;padding:12px;border-radius:6px}.crop{width:100%;height:190px;object-fit:contain;image-rendering:pixelated}.context{width:100%}pre{white-space:pre-wrap}textarea{width:90%}#status{color:#ffe082}</style>
<h2>実OBS 武器誤判定Viewer</h2><p>marginの大きい誤判定から表示。stateは自動推定です。誤判定原因はcropとcontextで人力確認し、タグとメモを保存できます。</p>
<label>方式<select id="method"><option value="">全方式</option></select></label><label>expected<select id="expected"><option value="">全武器</option></select></label><label>predicted<select id="predicted"><option value="">全武器</option></select></label><label>state<select id="state"><option value="">全状態</option><option>alive</option><option>down</option><option>unknown</option></select></label><label>scope<select id="scope"><option value="">全scope</option><option>cross_match</option><option>within_match_other_timestamp</option><option>official_only</option></select></label><label><input id="all" type="checkbox">正解も表示</label>
<button id="prev">前ページ</button><button id="next">次ページ</button><span id="count"></span><p id="status"></p><details><summary>評価report</summary><pre id="report"></pre></details><div id="rows"></div>
<script>
'use strict';const $=id=>document.getElementById(id);let offset=0,total=0,tags=[],weaponNames={};const weaponName=name=>weaponNames[name]||name||'none';
async function api(path,data){const r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const value=await r.json();if(!r.ok)throw Error(value.error);return value}
function guard(fn){return(...args)=>fn(...args).catch(e=>$('status').textContent=e.message)}
async function load(){const q=new URLSearchParams({offset,limit:24,all:$('all').checked?'1':'0'});for(const k of ['method','expected','predicted','state','scope'])if($(k).value)q.set(k,$(k).value);const result=await api('/api/errors?'+q);total=result.total;$('count').textContent=`${offset+1}〜${Math.min(offset+24,total)} / ${total}`;$('rows').replaceChildren();
 for(const r of result.rows){const card=document.createElement('article');card.className='card';const title=document.createElement('strong');title.textContent=`${r.method}: expected ${weaponName(r.expected)} → predicted ${weaponName(r.predicted)}`;card.appendChild(title);
 const crop=document.createElement('img');crop.className='crop';crop.loading='lazy';crop.src='/api/image?'+new URLSearchParams({id:r.review_id});crop.alt=r.sample_id;card.appendChild(crop);
 if(r.method.endsWith('_region')||r.method.endsWith('_foreground')){const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='照合領域（前処理後）';details.appendChild(summary);details.addEventListener('toggle',()=>{if(details.open&&!details.querySelector('img')){const img=document.createElement('img');img.className='crop processed';img.src='/api/image?'+new URLSearchParams({id:r.review_id,processed:1});details.appendChild(img)}});card.appendChild(details)}
 const meta=document.createElement('pre');meta.textContent=`${r.source_video}\nmatch ${r.match_id}\n${r.timestamp.toFixed(3)}s / frame ${r.frame_index} / ${r.side}${r.slot_index}\nstate ${r.state} / ${r.scope}\nbest ${r.best_score?.toFixed(4)} / second ${r.second_best_score?.toFixed(4)} / margin ${r.margin?.toFixed(4)}\nconfidence ${r.confidence?.toFixed(4)}\nblur variance ${r.blur_variance?.toFixed(1)} / special score ${r.special_score?.toFixed(3)}\n${r.top_k.map(c=>weaponName(c.weapon)+' '+c.score.toFixed(4)).join('\n')}`;card.appendChild(meta);
 const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='Context frame';details.appendChild(summary);details.addEventListener('toggle',()=>{if(details.open&&!details.querySelector('img')){const img=document.createElement('img');img.className='context';img.src='/api/image?'+new URLSearchParams({id:r.review_id,context:1});details.appendChild(img)}});card.appendChild(details);
 const chosen=new Set(r.review.tags||[]);for(const tag of tags){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=chosen.has(tag);input.onchange=()=>input.checked?chosen.add(tag):chosen.delete(tag);label.append(input,document.createTextNode(tag));card.appendChild(label)}
 const notes=document.createElement('textarea');notes.placeholder='原因・state誤り・派生武器などの人力メモ';notes.value=r.review.notes||'';card.appendChild(notes);const save=document.createElement('button');save.textContent='分析を保存';save.onclick=guard(async()=>{await api('/api/review',{id:r.review_id,tags:[...chosen],notes:notes.value});$('status').textContent='分析を保存しました'});card.appendChild(save);$('rows').appendChild(card)
 }}
for(const key of ['method','expected','predicted','state','scope','all'])$(key).onchange=guard(async()=>{offset=0;await load()});$('prev').onclick=guard(async()=>{offset=Math.max(0,offset-24);await load()});$('next').onclick=guard(async()=>{if(offset+24<total)offset+=24;await load()});
guard(async()=>{const data=await api('/api/report');tags=data.tags;weaponNames=data.weapon_names||{};for(const name of Object.keys(data.report.methods)){const o=document.createElement('option');o.value=o.textContent=name;$('method').appendChild(o)}for(const key of ['expected','predicted'])for(const name of data.report.candidate_universe){const o=document.createElement('option');o.value=name;o.textContent=weaponName(name);$(key).appendChild(o)}if(data.report.methods.obs_foreground){$('method').value='obs_foreground';$('state').value='alive';$('scope').value='cross_match'}$('report').textContent=JSON.stringify(data.report,null,2);await load()})();
</script></html>
